<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thiệp Cưới</title>
  <meta name="description" content="Trân trọng kính mời bạn đến dự lễ cưới của chúng mình">
  <script>if ("scrollRestoration" in history) history.scrollRestoration = "manual";</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fuzzy+Bubbles:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&text=%E5%9B%8D&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="leaves" aria-hidden="true"></div>

  <div id="envelope" class="envelope">
    <div class="env-stage">
      <div class="env">
        <div class="env-back"></div>
        <div class="env-letter">
          <p class="small">Trân trọng kính mời:</p>
          <p class="letter-names script" id="letterNames"></p>
        </div>
        <svg class="env-front" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf0d8"/><stop offset="1" stop-color="#f3dfb6"/></linearGradient>
            <linearGradient id="gFlap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9cf9a"/><stop offset="1" stop-color="#f0dba8"/></linearGradient>
          </defs>
          <polygon points="0,0 50,42 100,0 100,100 0,100" fill="url(#gFront)" stroke="url(#gFront)" stroke-width="10" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="env-text">
          <p class="env-names script" id="envNames"></p>
          <p class="env-date" id="envDate"></p>
          <p class="env-guest" id="envGuest"></p>
        </div>
        <svg class="env-flap" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <polygon points="0,0 100,0 50,100" fill="url(#gFlap)" stroke="url(#gFlap)" stroke-width="10" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="env-seal" id="envSeal" aria-label="Mở thiệp">&#22221;</div>
      </div>
    </div>
  </div>

  <header class="hero">
    <div class="hero-inner reveal">
      <p class="small">Chúng mình sắp cưới</p>
      <h1 class="script" data-names></h1>
      <p class="hero-date" id="heroDate"></p>
      <div class="countdown" id="countdown">
        <div><span id="cd-d">0</span><small>Ngày</small></div>
        <div><span id="cd-h">0</span><small>Giờ</small></div>
        <div><span id="cd-m">0</span><small>Phút</small></div>
        <div><span id="cd-s">0</span><small>Giây</small></div>
      </div>
    </div>
  </header>

  <main>
    <section class="section couple reveal">
      <p class="quote" id="quote"></p>
      <div class="couple-grid">
        <div class="person">
          <p class="small">Nhà trai</p>
          <p class="parents" id="groomParents"></p>
          <h2 class="script" id="groomName"></h2>
          <img class="cat cat-groom" src="images/cat-groom.webp" alt="" width="520" height="358" loading="lazy">
        </div>
        <div class="amp script">&amp;</div>
        <div class="person">
          <p class="small">Nhà gái</p>
          <p class="parents" id="brideParents"></p>
          <h2 class="script" id="brideName"></h2>
          <img class="cat cat-bride" src="images/cat-bride.webp" alt="" width="560" height="197" loading="lazy">
        </div>
      </div>
    </section>

    <section class="section reveal">
      <h2 class="title">Sự kiện cưới</h2>
      <div class="events" id="events"></div>
    </section>

    <section class="section reveal">
      <h2 class="title">Chuyện tình yêu</h2>
      <div class="timeline" id="story"></div>
    </section>

    <section class="section wide reveal">
      <h2 class="title">Album ảnh</h2>
      <div class="flip" id="flip">
        <div class="flip-wrap" id="flipWrap" tabindex="0" aria-label="Album ảnh dạng sách, vuốt hoặc bấm mũi tên để lật trang">
          <div class="book" id="book"></div>
        </div>
        <div class="flip-ctrl">
          <button type="button" id="flipPrev" class="flip-btn prev" aria-label="Trang trước"></button>
          <span id="flipCount" class="flip-count"></span>
          <button type="button" id="flipNext" class="flip-btn next" aria-label="Trang sau"></button>
        </div>
      </div>
    </section>

    <section class="section reveal">
      <h2 class="title">Xác nhận tham dự</h2>
      <form id="rsvp" class="rsvp">
        <input name="name" placeholder="Tên của bạn" required>
        <input name="phone" placeholder="Số điện thoại">
        <select name="attend">
          <option value="yes">Mình sẽ đến</option>
          <option value="no">Rất tiếc, mình không đến được</option>
        </select>
        <select name="guests">
          <option value="1">1 người</option>
          <option value="2">2 người</option>
          <option value="3">3 người trở lên</option>
        </select>
        <textarea name="message" rows="3" placeholder="Lời chúc gửi đến cô dâu chú rể"></textarea>
        <button class="btn" type="submit">Gửi xác nhận</button>
        <p class="rsvp-msg" id="rsvpMsg"></p>
      </form>
    </section>

    <section class="section reveal">
      <h2 class="title">Hộp mừng cưới</h2>
      <div class="gifts" id="gifts"></div>
    </section>
  </main>

  <footer class="footer">
    <p class="script" data-names></p>
    <p class="small">Cảm ơn bạn đã là một phần trong ngày vui của chúng mình</p>
  </footer>

  <button id="musicBtn" class="music" aria-label="Bật/tắt nhạc" hidden>Nhạc</button>
  <audio id="bgm" loop></audio>
  <div id="lightbox" class="lightbox" hidden><img alt=""></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
